<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "OP2 Display";
      src: url("../../assets/fonts/big-shoulders-latin.woff2") format("woff2");
      font-weight: 100 900;
    }

    @font-face {
      font-family: "OP2 Mono";
      src: url("../../assets/fonts/cutive-mono-latin.woff2") format("woff2");
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: #080706; }
    .card {
      position: relative;
      width: 1200px;
      height: 675px;
      overflow: hidden;
      color: #f1e8d8;
      background: linear-gradient(180deg, #121211 0%, #211915 58%, #090807 100%);
    }

    .cena {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .chamada {
      position: absolute;
      top: 62px;
      left: 0;
      right: 0;
      color: #d7bc83;
      font: 18px "OP2 Mono", monospace;
      letter-spacing: .22em;
      text-align: center;
      text-transform: uppercase;
    }

    .titulo {
      position: absolute;
      top: 340px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f4ead8;
      font: 700 76px/.88 "OP2 Display", sans-serif;
      letter-spacing: .045em;
      text-align: center;
      text-shadow: 0 3px 20px #000;
      text-transform: uppercase;
    }

    .titulo small {
      margin-top: 12px;
      color: #d7bc83;
      font: 600 26px "OP2 Mono", monospace;
      letter-spacing: .3em;
    }

    .subtitulo {
      position: absolute;
      top: 535px;
      left: 0;
      right: 0;
      color: #e4d7c3;
      font: 17px "OP2 Mono", monospace;
      letter-spacing: .15em;
      text-align: center;
      text-shadow: 0 2px 8px #000;
      text-transform: uppercase;
    }

    .selo {
      position: absolute;
      right: 35px;
      bottom: 25px;
      width: 116px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .9));
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="cena" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="ceu" x2="0" y2="1">
          <stop stop-color="#111514"/>
          <stop offset="1" stop-color="#38251a"/>
        </linearGradient>
        <radialGradient id="luz">
          <stop stop-color="#ffc86d" stop-opacity=".42"/>
          <stop offset="1" stop-color="#ffc86d" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="papel" x2="0" y2="1">
          <stop stop-color="#f8d99a"/>
          <stop offset="1" stop-color="#bd713c"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="675" fill="url(#ceu)"/>
      <circle cx="603" cy="250" r="172" fill="url(#luz)"/>
      <circle cx="603" cy="204" r="55" fill="#ead9b9" opacity=".13"/>
      <path d="M0 465 176 338l96 72 146-132 172 163 151-111 151 133 119-86 189 112v186H0Z" fill="#171715"/>
      <path d="m0 517 202-96 109 69 160-95 145 112 176-89 135 88 122-58 151 73v154H0Z" fill="#0c0b09"/>
      <path d="M0 590q175-32 349 0t350 0 350 0 151 0v85H0Z" fill="#090807"/>
      <g stroke="#3b2b1d" stroke-width="3">
        <path d="M125 0v82m178-82v138m595-138v126m174-126v91"/>
      </g>
      <g>
        <ellipse cx="125" cy="118" rx="88" ry="80" fill="url(#luz)"/>
        <path d="M103 89h44l8 13v43l-8 12h-44l-8-12v-43Z" fill="url(#papel)"/>
        <path d="M107 86h36v6h-36zm0 73h36v6h-36z" fill="#6a3824"/>
        <path d="M125 157v19" stroke="#d9a560" stroke-width="3"/>
        <ellipse cx="303" cy="177" rx="72" ry="64" fill="url(#luz)"/>
        <path d="M285 153h36l7 10v35l-7 10h-36l-7-10v-35Z" fill="url(#papel)"/>
        <path d="M288 150h30v5h-30zm0 59h30v5h-30z" fill="#6a3824"/>
        <path d="M303 214v16" stroke="#d9a560" stroke-width="3"/>
        <ellipse cx="898" cy="165" rx="82" ry="73" fill="url(#luz)"/>
        <path d="M877 138h42l8 12v39l-8 11h-42l-8-11v-39Z" fill="url(#papel)"/>
        <path d="M880 135h36v5h-36zm0 68h36v5h-36z" fill="#6a3824"/>
        <path d="M898 206v18" stroke="#d9a560" stroke-width="3"/>
        <ellipse cx="1072" cy="115" rx="72" ry="65" fill="url(#luz)"/>
        <path d="M1054 93h36l7 10v34l-7 10h-36l-7-10v-34Z" fill="url(#papel)"/>
        <path d="M1057 90h30v5h-30zm0 59h30v5h-30z" fill="#6a3824"/>
        <path d="M1072 147v16" stroke="#d9a560" stroke-width="3"/>
      </g>
      <rect width="1200" height="675" fill="#080706" opacity=".22"/>
      <path d="M0 0h1200v675H0z" fill="none" stroke="#d7bc83" stroke-opacity=".38" stroke-width="2"/>
    </svg>
    <div class="chamada">Campanha própria · Adaptação temática</div>
    <div class="titulo">
      <span>As Lanternas</span>
      <span>dos Esquecidos</span>
      <small>RPG</small>
    </div>
    <div class="subtitulo">Dinastia Tang · Ano 878</div>
    <img class="selo" src="../../assets/licenca/selo-branco.png" alt="Selo da Licença da Comunidade">
  </div>
</body>
</html>
